# dronesbycolin.conf — Nginx front door: TLS termination, the React app,
# the API proxy, and direct serving of public media so Express never has
# to push video bytes it doesn't need to.

# ───── port 80: redirect only ─────
# Plain HTTP exists solely to point at HTTPS. 301, no exceptions.
server {
    listen 80;
    server_name dronesbycolin.com www.dronesbycolin.com;
    return 301 https://$host$request_uri;
}

# ───── port 443: the actual site ─────
server {
    listen 443 ssl;
    server_name dronesbycolin.com www.dronesbycolin.com;

    # Let's Encrypt via certbot, which renews these on its own schedule.
    ssl_certificate     /etc/letsencrypt/live/dronesbycolin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dronesbycolin.com/privkey.pem;

    # 10G to match the backend's Multer limit exactly. If these two numbers
    # drift apart, uploads die here with a 413 and the backend logs show
    # nothing — a mystery nobody needs twice.
    client_max_body_size 10G;

    # React frontend: static build output, with the SPA fallback to
    # index.html so deep links like /portal don't 404 on refresh.
    location / {
        root /var/www/dronesbycolin/dist;
        try_files $uri $uri/ /index.html;
    }

    # API → Express on :3001.
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        # Stream uploads straight through instead of buffering. Buffering
        # a 10GB wedding video to disk before forwarding it would mean
        # writing it twice — once is plenty.
        proxy_request_buffering off;
        # One-hour timeouts: a multi-GB upload over residential internet in
        # Bryan, TX is a marathon, not a sprint. Default 60s would cut the
        # cord mid-file.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Public media served straight off disk — Nginx does this faster than
    # Express ever will. Client delivery files are deliberately NOT mapped
    # here: those exist only behind the authenticated
    # /api/portal/files/:id endpoint, and adding a /storage/uploads/clients/
    # block below would undo that entire access model in four lines.
    location /storage/stock/ {
        alias /storage/stock/;
        expires 7d;
    }
    location /storage/uploads/portfolio/ {
        alias /storage/uploads/portfolio/;
        expires 7d;
    }
    location /storage/uploads/settings/ {
        alias /storage/uploads/settings/;
        expires 1d; # the Part 107 badge can change after an admin upload
    }
}
