server {
    listen 80;
    server_name dronesbycolin.com www.dronesbycolin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dronesbycolin.com www.dronesbycolin.com;

    ssl_certificate     /etc/letsencrypt/live/dronesbycolin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dronesbycolin.com/privkey.pem;

    # Drone footage is huge — must match the backend's 10GB Multer limit
    client_max_body_size 10G;

    # Serve React frontend
    location / {
        root /var/www/dronesbycolin/dist;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to Express backend
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_request_buffering off;   # stream large uploads to the backend
        proxy_read_timeout 3600s;      # long-running multi-GB uploads
        proxy_send_timeout 3600s;
    }

    # Public stock + portfolio media served directly for efficiency.
    # Client delivery files are NOT here — they go through the
    # authenticated /api/portal/files/:id endpoint only.
    location /storage/stock/ {
        alias /storage/stock/;
        expires 7d;
    }
    location /storage/uploads/portfolio/ {
        alias /storage/uploads/portfolio/;
        expires 7d;
    }
    location /storage/uploads/settings/ {
        alias /storage/uploads/settings/;
        expires 1d;
    }
}
